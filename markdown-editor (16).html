<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--editor-font:'Lora',Georgia,serif;--ui-font:'Geist Mono',ui-monospace,Menlo,monospace}
[data-theme=sepia],[data-theme=sephora]{--bg:#161518;--panel:#1f1d22;--panel2:#28262d;--border:#35323a;--text:#ece5d8;--muted:#968b7c;--accent:#d97757}
[data-theme=dracula]{--bg:#282a36;--panel:#21222c;--panel2:#343746;--border:#44475a;--text:#f8f8f2;--muted:#8791be;--accent:#bd93f9}
[data-theme=forest]{--bg:#1b2420;--panel:#151e1a;--panel2:#25332c;--border:#2c3b33;--text:#d8e2d0;--muted:#86998a;--accent:#8fbf7f}
[data-theme=nord]{--bg:#2e3440;--panel:#272c36;--panel2:#3b4252;--border:#434c5e;--text:#eceff4;--muted:#8b95a8;--accent:#88c0d0}
[data-theme=gruvbox]{--bg:#282828;--panel:#1d2021;--panel2:#3c3836;--border:#504945;--text:#ebdbb2;--muted:#a89984;--accent:#fabd2f}
[data-theme=solarized-dark]{--bg:#002b36;--panel:#00222b;--panel2:#073642;--border:#0d4451;--text:#93a1a1;--muted:#657b83;--accent:#2aa198}
[data-theme=solarized-light]{--bg:#fdf6e3;--panel:#eee8d5;--panel2:#e6dfc8;--border:#ddd6c1;--text:#586e75;--muted:#93a1a1;--accent:#cb4b16}
[data-theme=light]{--bg:#fff;--panel:#f6f6f4;--panel2:#ebebe8;--border:#e0e0dc;--text:#24292e;--muted:#6b7280;--accent:#2563eb}
[data-theme=monokai]{--bg:#272822;--panel:#1e1f1a;--panel2:#3e3d32;--border:#49483e;--text:#f8f8f2;--muted:#a59f85;--accent:#a6e22e}
[data-theme=one-dark]{--bg:#282c34;--panel:#21252b;--panel2:#2c313a;--border:#3b4048;--text:#abb2bf;--muted:#5c6370;--accent:#61afef}
[data-theme=tokyo-night]{--bg:#1a1b26;--panel:#16161e;--panel2:#24283b;--border:#2f334d;--text:#c0caf5;--muted:#565f89;--accent:#7aa2f7}
[data-theme=catppuccin]{--bg:#1e1e2e;--panel:#181825;--panel2:#313244;--border:#45475a;--text:#cdd6f4;--muted:#a6adc8;--accent:#f5c2e7}
[data-theme=rose]{--bg:#191724;--panel:#1f1d2e;--panel2:#26233a;--border:#403d52;--text:#e0def4;--muted:#908caa;--accent:#eb6f92}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
::selection{background:var(--accent);color:var(--bg)}
body{font:13px/1.5 var(--ui-font);background:var(--bg);color:var(--text);display:grid;grid-template-columns:270px 1fr;transition:grid-template-columns .2s}
body.collapsed{grid-template-columns:0 1fr}
aside{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none;min-width:0;transition:opacity .18s ease}
body.collapsed aside{opacity:0;pointer-events:none}
input,select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 9px}
input:focus,select:focus{outline:1px solid var(--accent)}
button{cursor:pointer;transition:background-color .12s ease,border-color .12s ease,color .12s ease,transform .08s ease}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.96)}
.ic-btn{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;transition:background-color .12s ease,color .12s ease,transform .08s ease}
.ic-btn:hover{background:var(--panel2);color:var(--text);border-color:transparent}
.ic-btn:active{transform:scale(.9)}
.ic-btn svg{width:16px;height:16px;display:block}
.shead{display:flex;align-items:center;gap:2px;padding:10px 8px;border-bottom:1px solid var(--border)}
.sfoot{border-top:1px solid var(--border);padding:7px 8px;display:flex;gap:3px}
.shead #sname{flex:1;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.corner-fallback{display:none}
body.collapsed .corner-fallback{display:inline-flex}
#tree{flex:1;overflow:auto;padding:6px}
.nitem{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--muted);transition:background-color .12s ease,color .12s ease;animation:itemIn .14s ease both}
.nitem:hover{background:var(--panel2)}
.nitem.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--muted);font-size:10.5px}
.empty{color:var(--muted);padding:10px 12px;font-size:12px}
main{height:100vh;overflow:auto;position:relative}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.bar button{padding:3px 9px}
#title{flex:1;color:var(--muted);cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title b{color:var(--text);font-weight:500}
#stat{color:var(--muted);font-size:11px}
#findbar{display:none;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:2px 5px}
#findbar.on{display:flex;animation:popIn .12s cubic-bezier(.16,1,.3,1)}
#findbar input{width:150px;border:none;background:transparent;outline:none;color:var(--text);font:12px var(--ui-font);padding:3px 2px}
#findbar input::placeholder{color:var(--muted)}
#findcnt{color:var(--muted);font-size:10.5px;min-width:34px;text-align:center}
#findbar .ic-btn{padding:2px 3px}
#findbar .ic-btn svg{width:13px;height:13px}
mark.fhit{background:color-mix(in srgb,var(--accent) 32%,transparent);color:inherit;border-radius:2px}
mark.fcur{background:color-mix(in srgb,var(--accent) 62%,transparent);box-shadow:0 0 0 1px var(--accent)}
.bar button{font-size:14px;line-height:1}
#dash,#settings,#trashview,#archiveview{display:none;padding:8px 40px 60px;max-width:1040px;margin:0 auto}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes itemIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.viewenter{animation:viewIn .18s cubic-bezier(.16,1,.3,1)}
.cb{transition:transform .1s ease}
.cb:active{transform:scale(.82)}
body.home #dash{display:block}
body.home #ed{display:none}
body.settings #settings,body.trashview #trashview,body.archiveview #archiveview{display:block}
body.settings #dash,body.trashview #dash,body.archiveview #dash,body.settings #ed,body.trashview #ed,body.archiveview #ed{display:none}
.dhead{display:flex;align-items:center;justify-content:space-between}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.pcard{border:1px solid var(--border);border-radius:11px;padding:13px 14px;display:flex;align-items:flex-start;gap:11px;animation:cardIn .2s cubic-bezier(.16,1,.3,1) both}
.pcard .pico{color:var(--accent);flex-shrink:0;margin-top:1px}
.pcard .pico svg{width:18px;height:18px}
.pcard .pbody{flex:1;min-width:0}
.pcard .pname{font-size:12.5px;font-weight:600}
.pcard .pdesc{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.5}
.pswitch{width:30px;height:17px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background-color .12s ease}
.pswitch::after{content:'';position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:transform .14s ease,background-color .12s ease}
.pswitch.on{background:color-mix(in srgb,var(--accent) 35%,var(--panel2));border-color:var(--accent)}
.pswitch.on::after{transform:translateX(13px);background:var(--accent)}
.pempty{color:var(--muted);font-size:12px;margin-top:14px}
#tocpanel{position:fixed;right:22px;top:70px;width:190px;max-height:60vh;overflow:auto;display:none;font-size:11.5px}
#tocpanel.on{display:block}
#tocpanel .ti{padding:5px 9px;border-left:2px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .12s ease,color .12s ease}
#tocpanel .ti:hover{color:var(--text);border-color:var(--accent)}
#tocpanel .ti.h2{padding-left:16px}#tocpanel .ti.h3{padding-left:23px;font-size:11px}
@media (max-width:1180px){#tocpanel{display:none!important}}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 18px;margin-top:18px}
.hcard{cursor:pointer;user-select:none;animation:cardIn .2s cubic-bezier(.16,1,.3,1) both}
.noanim .hcard,.noanim .nitem{animation:none}
.hcover{aspect-ratio:1/1;border-radius:11px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:border-color .12s ease,color .12s ease,transform .08s ease;color:var(--muted)}
.hcard:active .hcover{transform:scale(.96)}
.hcover svg{width:30%;height:30%;stroke:var(--accent)}
.hcard:hover .hcover{border-color:var(--accent)}
.hnewcov{background:transparent;border:1px dashed var(--border);color:var(--muted)}
.hnewcov svg{width:22%;height:22%;stroke:var(--muted)}
.hcard:hover .hnewcov{border-color:var(--accent);color:var(--accent)}
.hcard:hover .hnewcov svg{stroke:var(--accent)}
.hname{margin-top:8px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{color:var(--muted);font-size:10.5px;margin-top:1px}
.trash-count{color:var(--muted);font-size:11px;font-weight:400;margin-left:6px}
.trashlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.trashrow{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--panel);animation:cardIn .18s cubic-bezier(.16,.3,.3,1) both}
.trashinfo{flex:1;min-width:0}
.trashname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trashmeta{color:var(--muted);font-size:10.5px;margin-top:2px}
.trashactions{display:flex;gap:6px;flex-shrink:0}
.trashactions button{font-size:11px;padding:5px 9px}
.trashactions .danger{background:transparent;border-color:var(--border);color:var(--muted);transition:color .12s ease,border-color .12s ease}
.trashactions .danger:hover{color:var(--text);border-color:var(--accent)}
.trashlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#settings,#trashview,#archiveview{padding-top:22px;padding-bottom:120px}
.settings-section{margin-top:54px}
.settings-section h2{font:600 16px/1 'Lora',Georgia,serif;letter-spacing:.2px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.theme-card{border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;background:var(--panel);transition:border-color .12s ease,transform .08s ease}
.theme-card:hover{border-color:var(--accent)}
.theme-card:active{transform:scale(.98)}
.theme-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.theme-preview{height:44px;border:1px solid var(--border);border-radius:7px;position:relative;overflow:hidden}
.theme-preview i{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%)}
.theme-preview i:first-child{left:10px}
.theme-preview i:nth-child(2){left:24px}
.theme-preview i:nth-child(3){left:38px}
.theme-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:7px}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:12px}
.font-group-label{color:var(--muted);font-size:10.5px;letter-spacing:.07em;margin-top:26px}
.font-group-label:first-child{margin-top:14px}
.font-card{border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;background:var(--panel);transition:border-color .12s ease,transform .08s ease}
.font-card:hover{border-color:var(--accent)}
.font-card:active{transform:scale(.98)}
.font-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.fpreview{font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname{color:var(--muted);font-size:10.5px;margin-top:5px}
.font-card.sel .fname{color:var(--accent)}
.settings-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.settings-actions button{font-size:12px;padding:7px 12px}
#dash h1,#trashview .dhead h1,#archiveview .dhead h1,#settings>.dhead h1{font:600 21px/1 'Lora',Georgia,serif;letter-spacing:.2px}
#palette{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding-top:13vh;z-index:50}
#palette.on{display:flex}
#palette.on{animation:fadeBg .15s ease}
.pbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:min(560px,90vw);overflow:hidden;box-shadow:0 24px 70px -10px rgba(0,0,0,.6);animation:popIn .16s cubic-bezier(.16,1,.3,1)}
.pbox input{width:100%;border:none;border-bottom:1px solid var(--border);padding:14px 16px;font:15px var(--ui-font);background:transparent;color:var(--text);border-radius:0}
.pbox input:focus{outline:none}
#plist{max-height:52vh;overflow:auto;padding:6px}
.pit{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background-color .1s ease}
.pit.sel,.pit:hover{background:var(--panel2)}
.pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{color:var(--muted);font-size:10.5px;flex-shrink:0}
.ic-btn[disabled]{opacity:.3;pointer-events:none}
#search{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding-top:13vh;z-index:50}
#search.on{display:flex;animation:fadeBg .15s ease}
#search .pbox{width:min(660px,92vw)}
#search .pbox input{border-bottom:none;padding:0;width:auto;flex:1;min-width:0}
#sq::placeholder{color:var(--muted)}
.sbar{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sbar>svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
#sscope{flex-shrink:0;font:10.5px var(--ui-font);color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;transition:color .12s ease;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sscope:hover{color:var(--text)}
#sres{max-height:56vh;overflow:auto;padding:6px}
.srow{padding:9px 10px;border-radius:7px;cursor:pointer;transition:background-color .1s ease}
.srow.sel,.srow:hover{background:var(--panel2)}
.stop{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.snm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smt{color:var(--muted);font-size:10.5px;flex-shrink:0}
.ssnip{color:var(--muted);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--editor-font)}
.srow mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text);border-radius:3px}
#ed{max-width:780px;margin:0 auto;padding:36px 48px 55vh;outline:none;font:17px/1.75 var(--editor-font);white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
#modal.on{display:flex;animation:fadeBg .15s ease}
.mbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:min(380px,90vw);padding:18px;box-shadow:0 24px 70px -10px rgba(0,0,0,.6);animation:popIn .16s cubic-bezier(.16,1,.3,1)}
.mbox h3{font:600 14px/1 var(--ui-font);margin-bottom:12px}
.mbox p{margin-bottom:14px}
.mbox input{width:100%;margin-bottom:14px;display:block}
.mrow{display:flex;gap:8px;justify-content:flex-end}
.mrow button{padding:6px 14px}
.mrow .danger{background:color-mix(in srgb,#e5493c 18%,var(--panel2));border-color:#e5493c;color:#ff8c7f}
#cmenu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:4px;min-width:150px;box-shadow:0 14px 34px -8px rgba(0,0,0,.55);display:none;transform-origin:top left}
#cmenu.on{display:block;animation:popIn .12s cubic-bezier(.16,1,.3,1)}
.cmi{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:background-color .1s ease}
.cmi:hover{background:var(--panel2)}
.cmi.danger{color:#ff8c7f}
.ln{min-height:1.75em}
.ln:not(.act) .mk{font-size:0}
.mk{color:var(--muted);opacity:.8}
.h1,.h2,.h3,.h4,.h5,.h6{font-weight:700;line-height:1.3;margin:.55em 0 .15em}
.h1{font-size:2em}.h2{font-size:1.55em}.h3{font-size:1.28em}.h4{font-size:1.1em}.h5,.h6{font-size:1em;color:var(--muted)}
.h1:not(.act){border-bottom:1px solid var(--border);padding-bottom:.15em}
b{font-weight:700}s{color:var(--muted)}
.ic{font:.86em 'Geist Mono',monospace;background:var(--panel2);border-radius:4px;padding:1px 4px}
#ed a{color:inherit;text-decoration:none}
#ed a.lk{color:var(--accent);text-decoration:underline}
#ed a.wl{color:var(--accent);text-decoration:underline dotted}
.ln:not(.act) .lk,.ln:not(.act) .wl{cursor:pointer}
.ln.act .lk,.ln.act .wl{cursor:text}
.q{border-left:3px solid var(--accent);padding-left:1em;color:var(--muted);font-style:italic}
.hr:not(.act){border-bottom:1px solid var(--border);height:.9em;min-height:0;margin-bottom:.6em}
.lm,.om{color:var(--accent)}
.ln:not(.act) .lm{font-size:0}
.ln:not(.act) .lm::before{content:'•';font-size:17px;margin-right:.55em}
.cb{color:var(--accent);cursor:pointer;font-weight:600}
.done{color:var(--muted)}
.cf,.tb{font:14px/1.6 'Geist Mono',monospace;background:var(--panel);padding:0 14px}
.cfm{color:var(--muted)}
.pp{color:var(--muted)}.ts{color:var(--muted)}
</style>
</head>
<body class="home">
<aside>
  <div class="shead">
    <button id="home" class="ic-btn" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg></button>
    <button id="tog" class="ic-btn" title="Toggle sidebar (Ctrl+\)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span id="sname"></span>
    <button id="addbtn" class="ic-btn" title="New"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
const $=s=>document.querySelector(s), ed=$('#ed');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function animateIn(el){el.classList.remove('viewenter');void el.offsetWidth;el.classList.add('viewenter');}
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- IndexedDB: notebooks + notes (trash lives in localStorage) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('notebooks-md'); // no version pin: never blocks on a tab holding an older version
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('nb'))db.createObjectStore('nb',{keyPath:'id'});if(!db.objectStoreNames.contains('note'))db.createObjectStore('note',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('IndexedDB blocked'));});
const tx=(s,m,f)=>DB.then(d=>new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));
const all=s=>tx(s,'readonly',o=>o.getAll()), put=(s,v)=>tx(s,'readwrite',o=>o.put(v)), del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

/* ---------- live-preview renderer ---------- */
const RX=/(`[^`\n]+`)|(\[\[[^\]\n]+\]\])|(\[[^\]\n]*\]\([^)\n]*\))|(\*\*[^*\n]+?\*\*|__[^_\n]+?__)|(~~[^~\n]+?~~)|(\*[^*\n]+?\*|(?<!\w)_[^_\n]+?_(?!\w))/g;
const mk=t=>'<span class="mk">'+esc(t)+'</span>';
function inl(s){ // every source character stays in the DOM as text; markers are just styled spans
  let o='',last=0,m;const re=new RegExp(RX.source,'g');
  while((m=re.exec(s))){
    o+=esc(s.slice(last,m.index));const t=m[0];
    if(m[1])o+='<span class="ic">'+mk('`')+esc(t.slice(1,-1))+mk('`')+'</span>';
    else if(m[2]){ // no href: clicking must never navigate or jump the scroll
      const nm=t.slice(2,-2);o+='<a class="wl" data-wl="'+esc(nm).replace(/"/g,'&quot;')+'">'+mk('[[')+esc(nm)+mk(']]')+'</a>';
    }
    else if(m[3]){const k=t.indexOf('](');const url=t.slice(k+2,-1);o+='<a class="lk" href="'+esc(url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener noreferrer">'+mk('[')+inl(t.slice(1,k))+mk(t.slice(k))+'</a>';}
    else if(m[4])o+='<b>'+mk(t.slice(0,2))+inl(t.slice(2,-2))+mk(t.slice(-2))+'</b>';
    else if(m[5])o+='<s>'+mk('~~')+inl(t.slice(2,-2))+mk('~~')+'</s>';
    else o+='<i>'+mk(t[0])+inl(t.slice(1,-1))+mk(t[0])+'</i>';
    last=re.lastIndex;
  }
  return o+esc(s.slice(last));
}
function renderLine(d,s,mode){
  let cls='',h='',m;
  if(mode){cls='cf'+(mode==='f'?'':' cfm');h=esc(s);}
  else if(m=s.match(/^(#{1,6})(\s+)(.*)$/)){cls='h'+m[1].length;h=mk(m[1]+m[2])+inl(m[3]);}
  else if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(s)){cls='hr';h=mk(s);}
  else if(m=s.match(/^(\s*)([-*+])(\s)\[([ xX])\](\s.*|)$/)){cls='li'+(m[4]===' '?'':' done');h=m[1]+'<span class="lm">'+m[2]+m[3]+'</span><span class="cb">['+(m[4]===' '?' ':'x')+']</span>'+inl(m[5]);}
  else if(m=s.match(/^(\s*)([-*+])(\s+)(.*)$/)){cls='li';h=m[1]+'<span class="lm">'+m[2]+m[3]+'</span>'+inl(m[4]);}
  else if(m=s.match(/^(\s*)(\d+[.)])(\s+)(.*)$/)){cls='li';h=m[1]+'<span class="om">'+m[2]+m[3]+'</span>'+inl(m[4]);}
  else if(m=s.match(/^(\s*>+\s?)(.*)$/)){cls='q';h=mk(m[1])+inl(m[2]);}
  else if(/^\s*\|.*\|\s*$/.test(s)){cls='tb'+(/^[\s|:-]+$/.test(s)?' ts':'');h=esc(s).replace(/\|/g,'<span class="pp">|</span>');}
  else h=inl(s);
  d.className='ln '+cls+(d.classList.contains('act')?' act':'');
  d.innerHTML=h||'<br>';
}

/* ---------- model: text is the truth, DOM is a view ---------- */
let text='',undo=[],redo=[],lastT=0,lastK='';
const lines=()=>text.split('\n');
function starts(){const s=[0];for(const l of lines())s.push(s[s.length-1]+l.length+1);return s;}
function lineOf(o){const S=starts();let i=0;while(i<S.length-2&&S[i+1]<=o)i++;return i;}
function sync(){
  const L=lines();let f=false;
  while(ed.children.length>L.length)ed.lastChild.remove();
  L.forEach((s,i)=>{
    const fl=/^\s*```/.test(s);let mode=f?(fl?'fe':'f'):(fl?'fs':'');if(fl)f=!f;
    let d=ed.children[i];
    if(!d){d=document.createElement('div');ed.appendChild(d);d._t=null;}
    if(d._t!==s||d._m!==mode){d._t=s;d._m=mode;renderLine(d,s,mode);}
  });
}
function domToOff(node,off){
  const n=ed.children.length,S=starts();
  if(node===ed)return off>=n?text.length:S[off];
  let d=node;while(d&&d.parentNode!==ed)d=d.parentNode;if(!d)return 0;
  const i=[...ed.children].indexOf(d),r=document.createRange();r.selectNodeContents(d);
  try{r.setEnd(node,off);}catch(e){}
  return S[i]+Math.min(r.toString().length,d.textContent.length);
}
function offToDom(o){
  const S=starts();let i=0;while(i<S.length-2&&S[i+1]<=o)i++;
  const d=ed.children[i];let c=o-S[i];
  const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);let t;
  while((t=w.nextNode())){if(c<=t.length)return[t,c];c-=t.length;}
  return[d,0];
}
function getSel(){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;return[domToOff(s.anchorNode,s.anchorOffset),domToOff(s.focusNode,s.focusOffset)];}
function setSel(a,b=a){const[n1,o1]=offToDom(a),[n2,o2]=offToDom(b);getSelection().setBaseAndExtent(n1,o1,n2,o2);}
function act(){
  ed.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));
  const s=getSel();if(!s)return;
  const i=lineOf(Math.min(...s)),j=lineOf(Math.max(...s));
  for(let k=i;k<=j;k++)ed.children[k]&&ed.children[k].classList.add('act');
}
document.addEventListener('selectionchange',act);

function edit(a,b,ins,kind='x',sa,sb){
  const sel=getSel(),now=Date.now();
  if(!(kind==='t'&&lastK==='t'&&now-lastT<900)){undo.push([text,sel]);if(undo.length>300)undo.shift();}
  lastT=now;lastK=kind;redo=[];
  text=text.slice(0,a)+ins+text.slice(b);
  sync();const c=sa??a+ins.length;setSel(c,sb??c);changed();
}
function restore(from,to){if(!from.length)return;const[t,s]=from.pop();to.push([text,getSel()]);text=t;lastK='';sync();if(s)setSel(s[0],s[1]);changed();}
const doUndo=()=>restore(undo,redo), doRedo=()=>restore(redo,undo);

function enter(a,b){
  const S=starts(),i=lineOf(a),ls=S[i],L=lines(),line=L[i];
  let f=false;for(let k=0;k<i;k++)if(/^\s*```/.test(L[k]))f=!f;
  if(f)return edit(a,b,'\n'+line.match(/^\s*/)[0],'x');
  const lm=line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s+)?/),qm=!lm&&line.match(/^(\s*>+\s?)/),pre=lm||qm;
  if(pre&&a>=ls+pre[0].length){
    if(!line.slice(pre[0].length).trim()&&a===b)return edit(ls,ls+line.length,'','x',ls);
    let mkr;
    if(qm)mkr=qm[1].endsWith(' ')?qm[1]:qm[1]+' ';
    else{const t=lm[2];mkr=lm[1]+(/\d/.test(t)?(parseInt(t,10)+1)+t.slice(-1):t)+lm[3]+(lm[4]?'[ ] ':'');}
    return edit(a,b,'\n'+mkr,'x');
  }
  edit(a,b,'\n','x');
}
function wrap(m){
  const s=getSel();if(!s)return;let a=Math.min(...s),b=Math.max(...s);const L=m.length;
  if(a===b){const w=/[\p{L}\p{N}_'-]/u;while(a>0&&w.test(text[a-1]))a--;while(b<text.length&&w.test(text[b]))b++;}
  if(text.slice(a-L,a)===m&&text.slice(b,b+L)===m&&(m!=='*'||(text[a-2]!=='*'&&text[b+1]!=='*')))return edit(a-L,b+L,text.slice(a,b),'x',a-L,b-L);
  const inner=text.slice(a,b);edit(a,b,m+inner+m,'x',a+L,a+L+inner.length);
}

ed.addEventListener('beforeinput',e=>{
  if(e.isComposing)return;
  e.preventDefault();
  const s=getSel();if(!s)return;
  let a=Math.min(...s),b=Math.max(...s);const t=e.inputType;
  if(t==='insertText'||t==='insertReplacementText'){if(e.data!=null)edit(a,b,e.data,'t');return;}
  if(t==='insertParagraph'||t==='insertLineBreak')return enter(a,b);
  if(t.startsWith('insertFrom'))return edit(a,b,((e.dataTransfer&&e.dataTransfer.getData('text/plain'))||'').replace(/\r\n?/g,'\n'));
  if(t.startsWith('delete')){
    if(a===b){const r=e.getTargetRanges()[0];
      if(r){a=domToOff(r.startContainer,r.startOffset);b=domToOff(r.endContainer,r.endOffset);}
      else if(t.includes('Backward'))a=Math.max(0,a-1);else b=Math.min(text.length,b+1);}
    if(a!==b)edit(a,b,'','d');return;
  }
  if(t==='historyUndo')return doUndo();if(t==='historyRedo')return doRedo();
});
ed.addEventListener('compositionend',()=>{ // IME: let the browser edit, then re-read the DOM
  text=[...ed.children].map(d=>d.textContent).join('\n');
  const c=getSel();ed.querySelectorAll('.ln').forEach(d=>d._t=null);sync();if(c)setSel(c[0],c[1]);changed();
});
const clip=(e,cut)=>{const s=getSel();if(!s||s[0]===s[1])return;e.preventDefault();const a=Math.min(...s),b=Math.max(...s);e.clipboardData.setData('text/plain',text.slice(a,b));if(cut)edit(a,b,'','d');};
ed.addEventListener('copy',e=>clip(e,false));ed.addEventListener('cut',e=>clip(e,true));

ed.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&!e.altKey){
    if(k==='b'){e.preventDefault();return wrap('**');}
    if(k==='i'){e.preventDefault();return wrap('*');}
    if(k==='z'){e.preventDefault();return e.shiftKey?doRedo():doUndo();}
    if(k==='y'){e.preventDefault();return doRedo();}
  }
  if(e.key==='Tab'&&!mod){
    e.preventDefault();const s=getSel();if(!s)return;
    const a=Math.min(...s),b=Math.max(...s),i=lineOf(a),j=lineOf(b),S=starts(),L=lines();
    if(!e.shiftKey&&i===j&&!/^\s*([-*+]|\d+[.)])\s/.test(L[i]))return edit(a,b,'  ','t');
    let d1=0,dt=0;
    const out=L.slice(i,j+1).map((l,n)=>{const d=e.shiftKey?-(l.match(/^ {1,2}/)||[''])[0].length:2;if(n===0)d1=d;dt+=d;return e.shiftKey?l.slice(-d):'  '+l;});
    if(!dt)return; // nothing indented to strip — don't push a no-op onto the undo stack
    edit(S[i],S[j+1]-1,out.join('\n'),'x',a+d1,b+dt);
  }
});
ed.addEventListener('mousedown',e=>{
  const lnk=e.target.closest&&e.target.closest('a.lk,a.wl');
  if(lnk){
    const lln=lnk.closest('.ln');
    if(lln&&!lln.classList.contains('act')){
      e.preventDefault();
      if(lnk.classList.contains('wl'))gotoWiki(lnk.dataset.wl);
      else{const href=lnk.getAttribute('href');if(href)window.open(href,'_blank','noopener');}
    }
    return; // active line: fall through to native caret placement, no navigation
  }
  const cb=e.target.closest&&e.target.closest('.cb'),ln=cb&&cb.closest('.ln');
  if(cb&&ln&&!ln.classList.contains('act')){
    e.preventDefault();const i=[...ed.children].indexOf(ln),S=starts(),o=S[i]+lines()[i].search(/\[[ xX]\]/)+1,cs=getSel();
    return edit(o,o+1,text[o]===' '?'x':' ','x',cs?Math.min(...cs):undefined);
  }
  if(e.target===ed||e.target===ed.parentNode){e.preventDefault();ed.focus();setSel(text.length);}
});

/* ---------- notes, notebooks, saving ---------- */
let NB=[],NT=[],cur=null,saveT=0;
let TRASH=[];try{TRASH=JSON.parse(LS.get('trash')||'[]');if(!Array.isArray(TRASH))TRASH=[];}catch(e){TRASH=[];}
const saveTrash=()=>LS.set('trash',JSON.stringify(TRASH));
const nbOf=id=>NB.find(n=>n.id===id);
const live=n=>!n.archived&&!(nbOf(n.nb)||{}).archived; // reachable only if the note *and* its notebook are both live
function flush(){if(!saveT||!cur)return;clearTimeout(saveT);saveT=0;cur.content=text;cur.updated=Date.now();put('note',cur).catch(()=>{});}
function changed(){
  act();if(!cur)return;
  clearTimeout(saveT);saveT=setTimeout(()=>{saveT=1;flush();},500);
  if(document.body.classList.contains('home'))return; // word count + TOC belong to the editor view only
  const w=text.trim()?text.trim().split(/\s+/).length:0;
  $('#stat').textContent=w+' words'+(PLUGSTATE.readtime?' · '+Math.max(1,Math.round(w/200))+' min read':'');
  if(PLUGSTATE.toc)renderToc();
  if(FIND.open){clearTimeout(findT);findT=setTimeout(()=>findRun(true),120);} // keep highlights in step with edits, but not once per keystroke
}
/* ---------- find in note (Ctrl+F overrides the browser) ----------
   Matches are wrapped in <mark> spans inside the preview DOM; the source
   text is never touched (all input goes through edit()), so highlighting
   cannot corrupt the document. */
const FIND={open:false,marks:[],idx:0,total:0,save:null};
const FIND_MAX=400; // hard ceiling on <mark> nodes: a one-letter query can match tens of thousands of times
let findT=0;         // debounce handle — edits coalesce instead of re-wrapping per keystroke
function findClearMarks(){
  // unwrap only — no normalize(), so the caret's text node is never touched
  ed.querySelectorAll('mark.fhit').forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    p.removeChild(m);
  });
}
function findRun(keep){
  if(!FIND.open)return;
  const prev=FIND.idx;
  findClearMarks();
  FIND.marks=[];FIND.total=0;
  const q=$('#findq').value,cnt=$('#findcnt');
  if(!q){FIND.idx=0;cnt.textContent='';return;}
  const nodes=[];const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  let n;while(n=w.nextNode())nodes.push(n);
  let full='';const bounds=[];
  for(const nd of nodes){bounds.push({nd,start:full.length,end:full.length+nd.data.length});full+=nd.data;}
  let hay=full.toLowerCase(),needle=q.toLowerCase();
  if(hay.length!==full.length){hay=full;needle=q;} // case fold changed lengths; stay safe
  const hits=[];let i=0;
  while(needle&&(i=hay.indexOf(needle,i))>=0){hits.push([i,i+needle.length]);i+=needle.length;}
  if(!hits.length){FIND.idx=0;cnt.textContent='0/0';return;}
  FIND.total=hits.length;                 // the real number, for the counter
  const wrap=hits.length>FIND_MAX?hits.slice(0,FIND_MAX):hits; // …but only this many get DOM nodes
  FIND.marks=new Array(wrap.length);
  // wrap from the last match to the first so recorded offsets stay valid
  for(let h=wrap.length-1;h>=0;h--){
    const[s,e]=wrap[h],marks=[];
    for(let b=bounds.length-1;b>=0;b--){
      const{nd,start,end}=bounds[b];
      if(!(start<e&&end>s))continue;
      const from=Math.max(s,start)-start,to=Math.min(e,end)-start;
      nd.splitText(to);                 // nd keeps [0,to), rest holds the tail
      const piece=from>0?nd.splitText(from):nd;
      const m=document.createElement('mark');
      m.className='fhit';piece.parentNode.insertBefore(m,piece);m.appendChild(piece);

/* ---------- navigation history: a stack of notes (id) and views (null) ----------
   Wiki links move you forward; this is the way back. */
let HIST=[],HI=-1,histLock=false;
function histAdd(id){
  if(HIST[HI]===id)return; // revisiting where we already are isn't a new step
  HIST=HIST.slice(0,HI+1); // a new step discards the forward branch
  HIST.push(id);
  if(HIST.length>60)HIST.shift();
  HI=HIST.length-1;
  histUI();
}
function histUI(){
  const b=$('#histback'),f=$('#histfwd');
  if(!b||!f)return;
  b.disabled=HI<=0;
  f.disabled=HI>=HIST.length-1;
}
function histGo(d){
  const t=HI+d;
  if(t<0||t>=HIST.length)return;
  const id=HIST[t],n=id==null?null:NT.find(x=>x.id===id);
  if(id!=null&&(!n||!live(n))){ // gone or archived — drop the step and retry
    HIST.splice(t,1);if(t<HI)HI--;histUI();return histGo(d);
  }
  HI=t;histLock=true; // the jump itself mustn't re-record the step
  try{ if(id==null)showHome();else openNote(n); }
  finally{ histLock=false; }
  histUI();
}
$('#histback').onclick=()=>histGo(-1);   // these were the missing link — the buttons rendered but did nothing

}

async function moveToTrash(id,isNb){
  flush(); // keep any unsaved typing in the copy that lands in the trash
  const entry={id:uid(),kind:isNb?'notebook':'note',deletedAt:Date.now()};
  if(isNb){
    const nb=nbOf(id);if(!nb)return;

  }else{

  }

async function restoreTrash(id){
  const i=TRASH.findIndex(e=>e.id===id);if(i<0)return;
  const e=TRASH[i];
  if(e.kind==='notebook'){
    let nb={...(e.item||{})};
    if(NB.some(n=>n.id===nb.id))nb.id=uid();
    nb.archived=false; // restore must bring it back somewhere the user can see it
    let base=nb.name||'Notebook',nm=base,c=1;
    while(NB.some(n=>n.name===nm))nm=base+' '+(++c);
    nb.name=nm;NB.push(nb);put('nb',nb).catch(()=>{});
    for(const raw of e.notes||[]){
      let n={...raw,nb:nb.id};
      if(NT.some(x=>x.id===n.id))n.id=uid();
      let b=n.name||'Untitled',v=b,k=1;
      while(NT.some(x=>x.nb===nb.id&&x.name===v))v=b+' '+(++k);
      n.name=v;NT.push(n);put('note',n).catch(()=>{});
    }
  }else{
    let n={...(e.item||{})};
    n.archived=false; // same rule: restoring an invisible note looks like nothing happened
    const orig=nbOf(n.nb);
    let target=(orig&&!orig.archived&&orig.id)||(NB.find(x=>!x.archived)||{}).id;
    if(!target){const fresh={id:uid(),name:'Notebook',open:true};NB.push(fresh);put('nb',fresh).catch(()=>{});target=fresh.id;}
    if(NT.some(x=>x.id===n.id))n.id=uid();
    let base=n.name||'Untitled',nm=base,c=1;
    while(NT.some(x=>x.nb===target&&x.name===nm))nm=base+' '+(++c);
    n.nb=target;n.name=nm;NT.push(n);put('note',n).catch(()=>{});
  }
  TRASH.splice(i,1);saveTrash();
  renderHome();renderSidebar();renderTrash();
}

      if(entry.dir||!/\.(md|markdown|txt)$/i.test(path))continue;
      const parts=path.split('/').filter(Boolean);
      const folder=parts.length>1?parts[0]:'Imported';
      const fname=parts[parts.length-1].replace(/\.(md|markdown|txt)$/i,'');
      (byFolder[folder]=byFolder[folder]||(byFolder[folder]=[])).push({fname,entry});
    }
    for(const folder in byFolder){

function fuzzy(q,s){
  q=q.toLowerCase();s=s.toLowerCase();let qi=0,score=0,streak=0;
  for(let i=0;i<s.length&&qi<q.length;i++){if(s[i]===q[qi]){score+=1+streak;streak++;qi++;}else streak=0;}
  return qi===q.length?score:-1;
}

  const cmdItems=CMDS.map(c=>({type:'cmd',label:c.label,sub:c.sub||'Command',run:c.run,score:q?fuzzy(q,c.label):0}));
  if(PLUGSTATE.daily)cmdItems.unshift({type:'cmd',label:'Daily note',sub:'Plugin',run:openDailyNote,score:q?fuzzy(q,'daily note'):0});
  let items=q?[...noteItems,...cmdItems].filter(i=>i.score>=0).sort((a,b)=>b.score-a.score):[...noteItems.slice(0,8),...cmdItems];
  pItems=items.slice(0,30);pSel=0;renderPalette();

function keepInView(list,el){ // scroll the list itself, never the page
  if(!list||!el)return;
  const r=el.getBoundingClientRect(),lr=list.getBoundingClientRect();
  if(r.top<lr.top)list.scrollTop-=(lr.top-r.top);
  else if(r.bottom>lr.bottom)list.scrollTop+=(r.bottom-lr.bottom);
}

/* ---------- search across every note (Ctrl+Shift+F / Ctrl+K) ----------
   Titles fuzzy-match, bodies substring-match — so a real word actually finds
   the note, and the snippet shows you which line and why. */
const SEARCH={open:false,scope:'all',sel:0,items:[]};
const searchScopeId=()=>(SEARCH.scope==='nb'&&cur&&nbOf(cur.nb))?cur.nb:null;
function searchRun(){
  const q=$('#sq').value.trim(),nd=q.toLowerCase(),scope=searchScopeId();
  SEARCH.items=[];
  if(nd){
    for(const n of NT){
      if(!live(n))continue;
      if(scope&&n.nb!==scope)continue;
      const title=n.name.toLowerCase(),at=title.indexOf(nd);
      const lines=n.content.split('\n');
      let count=0,firstLine=-1;
      for(let i=0;i<lines.length;i++){
        const lc=lines[i].toLowerCase();let p=0,c=0;
        while((p=lc.indexOf(nd,p))>=0){c++;p+=nd.length;}
        if(c){count+=c;if(firstLine<0)firstLine=i;}
      }
      if(!count&&at<0&&fuzzy(nd,title)<0)continue;
      SEARCH.items.push({n,count,firstLine,lines,rank:at>=0?0:(count?1:2)});
    }
    SEARCH.items.sort((a,b)=>a.rank-b.rank||b.count-a.count||((b.n.updated||0)-(a.n.updated||0)));
  }
  SEARCH.items=SEARCH.items.slice(0,60);
  if(SEARCH.sel>=SEARCH.items.length)SEARCH.sel=0;
  searchRender(q);
}
function markAll(s,nd){ // escape everything, then wrap only the real hits
  if(!nd)return esc(s);
  const lc=s.toLowerCase();
  if(lc.length!==s.length)return esc(s); // case fold changed lengths; highlights must stay aligned (same guard as findRun)
  let o='',p=0,i;
  while((i=lc.indexOf(nd,p))>=0){o+=esc(s.slice(p,i))+'<mark>'+esc(s.slice(i,i+nd.length))+'</mark>';p=i+nd.length;}
  return o+esc(s.slice(p));
}
function searchRender(q){
  const box=$('#sres'),nd=q.toLowerCase();
  if(!SEARCH.items.length){box.innerHTML=q?'<p class="empty">No matches</p>':'';return;}
  box.innerHTML=SEARCH.items.map((it,i)=>{
    const nb=nbOf(it.n.nb);
    const line=it.firstLine>=0?it.lines[it.firstLine]:'';
    let s=line;
    if(line.length>150){ // window the snippet around the first hit
      const at=line.toLowerCase().indexOf(nd),st=at>40?at-40:0;
      s=(st?'…':'')+line.slice(st,st+140)+(st+140<line.length?'…':'');
    }
    return '<div class="srow'+(i===SEARCH.sel?' sel':'')+'" data-i="'+i+'">'
      +'<div class="stop"><span class="snm">'+markAll(it.n.name,nd)+'</span><span class="smt">'+esc(nb?nb.name:'')+(it.count?' · '+it.count:'')+'</span></div>'
      +(s?'<div class="ssnip">'+markAll(s,nd)+'</div>':'')
      +'</div>';
  }).join('');
  keepInView(box,box.querySelector('.srow.sel'));
}
